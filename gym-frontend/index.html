<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#047857" />
    <script>
      // Apply the saved preference before styles and React paint.
      (() => {
        let theme = 'system';
        try { const saved = localStorage.getItem('fitcore_theme'); if (['light', 'dark', 'system'].includes(saved)) theme = saved; } catch { /* Use system preference. */ }
        document.documentElement.classList.toggle('dark', theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>FitCore Gym Management</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
