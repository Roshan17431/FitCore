# Tests never use the configured development or production database.
spring.datasource.url=jdbc:h2:mem:fitcore-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
jwt.secret=fitcore-isolated-security-tests-only-secret-at-least-32-characters
jwt.expiration-ms=86400000
aws.s3.enabled=false
logging.level.com.fitcore.gym=ERROR

spring.flyway.enabled=false
