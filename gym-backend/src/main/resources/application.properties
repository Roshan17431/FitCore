spring.application.name=GymBackend
server.port=${PORT:8080}

# Foundation builds do not import application environment files.

# PostgreSQL DataSource Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=${SQL_INIT_MODE:never}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://fit-core-git-master-roshan17431s-projects.vercel.app,https://fit-core-one-beta.vercel.app,http://localhost:5173,http://127.0.0.1:5173}

# AWS S3 Configuration
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.access.key.id=${AWS_ACCESS_KEY_ID:}
aws.secret.access.key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_BUCKET_NAME:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Migration execution is explicit and separate from application startup.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
